<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孩子的英文自我介绍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .avatar {
            width: 130px;
            height: 130px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .welcome-text {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .emoji {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 10px;
            height: 50px;
            accent-color: #667eea;
        }
        .status {
            color: #999;
            font-size: 13px;
            margin-top: 20px;
        }
        .loading {
            color: #667eea;
            font-weight: bold;
        }
        .error {
            background: #fed7d7;
            color: #742a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #fc8181;
        }
        @media (max-width: 600px) {
            .player-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 50px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="avatar">🎤</div>
        <h1 id="childName">加载中...</h1>
        <p class="subtitle">English Self-Introduction</p>
        
        <div class="welcome-text">
            <span class="emoji">👂</span>
            倾听孩子的童真心声
        </div>

        <div id="errorBox" class="error" style="display: none;"></div>

        <audio id="audioPlayer" controls>
            <source id="audioSource" src="" type="audio/mpeg">
            您的浏览器不支持音频播放
        </audio>

        <p class="status">
            <span class="loading" id="loadingStatus">正在加载...</span>
        </p>
    </div>

    <script>
        // 孩子信息配置
        const children = {
            '小明': { filename: 'xiaoming.mp3', displayName: '小明 (Xiaoming)' },
            '小红': { filename: 'xiaohong.mp3', displayName: '小红 (Xiaohong)' },
            '小刚': { filename: 'xiaogang.mp3', displayName: '小刚 (Xiaogang)' },
            '小丽': { filename: 'xiaoli.mp3', displayName: '小丽 (Xiaoli)' },
            '小王': { filename: 'xiaowang.mp3', displayName: '小王 (Xiaowang)' }
        };

        // 获取URL参数
        const params = new URLSearchParams(window.location.search);
        const childName = params.get('child') || '';

        const childData = children[childName];

        if (!childData) {
            // 参数无效
            document.getElementById('childName').textContent = '不存在';
            document.getElementById('loadingStatus').textContent = '';
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'block';
            errorBox.innerHTML = '❌ 抱歉，未找到该孩子的信息';
        } else {
            // 设置孩子名字
            document.getElementById('childName').textContent = childData.displayName;

            // 构建音频URL
            let baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            const audioUrl = baseUrl + '/audios/' + childData.filename;

            // 设置音频源
            const audioSource = document.getElementById('audioSource');
            const audioPlayer = document.getElementById('audioPlayer');
            const loadingStatus = document.getElementById('loadingStatus');

            audioSource.src = audioUrl;

            // 监听音频加载事件
            audioPlayer.addEventListener('canplay', function() {
                loadingStatus.textContent = '✅ 点击播放按钮开始播放';
                loadingStatus.classList.remove('loading');
            });

            audioPlayer.addEventListener('play', function() {
                loadingStatus.textContent = '🎵 正在播放...';
            });

            audioPlayer.addEventListener('ended', function() {
                loadingStatus.textContent = '✅ 播放完成';
            });

            audioPlayer.addEventListener('error', function() {
                const errorBox = document.getElementById('errorBox');
                errorBox.style.display = 'block';
                errorBox.innerHTML = '❌ 音频加载失败，请检查网络连接';
                loadingStatus.textContent = '';
            });

            // 自动播放（大多数浏览器需要用户交互才能自动播放，这里设置为可点击播放）
            // 如果要实现真正的自动播放，需要用户手势（如点击页面）
            document.addEventListener('click', function autoPlayOnce() {
                audioPlayer.play().catch(error => {
                    console.log('自动播放被阻止，需要用户交互');
                });
                document.removeEventListener('click', autoPlayOnce);
            }, { once: true });
        }
    </script>
</body>
</html>
